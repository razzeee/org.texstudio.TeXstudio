app-id: org.texstudio.TeXstudio
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk
  - org.freedesktop.Sdk.Extension.openjdk21
add-extensions:
  org.freedesktop.Sdk.Extension.texlive:
    directory: texlive
    subdirectories: true
    autodelete: true
    version: '25.08'
    no-autodownload: true
command: texstudio.sh
rename-icon: texstudio
rename-appdata-file: texstudio.metainfo.xml
rename-desktop-file: texstudio.desktop
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network # required for template repository. Does not interfere with LanguageTool, which is now accessible on the host as well
  - --device=dri
  # filesystem access: required e.g. for \include, \input or \includegraphics
  - --filesystem=host
  - --filesystem=/tmp # this way lualatex etc. can access files newly ceated by TeXstudio stored in the hosts's /tmp
  - --talk-name=org.freedesktop.Flatpak # required for flatpak-spawn --host
  - --talk-name=com.canonical.AppMenu.Registrar # required for global menu
  - --env=PATH=/usr/bin:/app/bin:/app/texlive/bin:/app/texlive/bin/x86_64-linux:/app/texlive/bin/aarch64-linux:/app/jre/bin # add paths of TeXlive Flatpak extension binaries
  - --env=LD_LIBRARY_PATH=/app/texlive/lib/ # add library paths
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
modules:
  - name: extension-points
    buildsystem: simple
    build-commands:
      - mkdir /app/texlive

  - name: poppler # build dependency of TeXstudio
    buildsystem: cmake-ninja
    config-opts: # for command line switches, cf. CMakeLists.txt
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_QT5_TESTS=OFF
      - -DBUILD_QT6_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DBUILD_MANUAL_TESTS=OFF
      - -DENABLE_GLIB=OFF
      - -DENABLE_QT5=OFF
      - -DENABLE_LIBCURL=OFF
      - -DENABLE_GPGME=OFF
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.10.0.tar.xz
        sha256: 6792cb7c69205007ad87d2e936cecc5b3a31fac29ab54ffc3175fdb6b2a6ce35
        x-checker-data:
          type: anitya
          project-id: 3686
          url-template: https://poppler.freedesktop.org/poppler-$version.tar.xz
    modules:
      - name: poppler-data # required to properly display CJK chars in PDF viewer
        buildsystem: cmake-ninja
        builddir: true
        config-opts:
          - -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo
        sources:
          - type: archive
            url: https://poppler.freedesktop.org/poppler-data-0.4.12.tar.gz
            sha256: c835b640a40ce357e1b83666aabd95edffa24ddddd49b8daff63adb851cdab74
            x-checker-data:
              type: anitya
              project-id: 3687
              url-template: https://poppler.freedesktop.org/poppler-data-$version.tar.gz
        post-install:
          - install -p -D -m 0644 ../COPYING* -t "${FLATPAK_DEST}/share/licenses/poppler-data/";
      - name: boost
        buildsystem: simple
        build-commands:
          - ./bootstrap.sh --prefix=/app --with-libraries=container
          - ./b2 -j $FLATPAK_BUILDER_N_JOBS install
        sources:
          - type: archive
            url: https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.gz
            sha256: c4a3b310ddd2472416e091067166b0713be97c63f38c212c484ada022fd296ce
            x-checker-data:
              type: anitya
              project-id: 6845
              url-template: https://archives.boost.io/release/$version/source/boost_${version0}_${version1}_${version2}.tar.gz

  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk/install.sh

  - name: languagetool
    buildsystem: simple
    build-commands:
      - |
        . /usr/lib/sdk/openjdk21/enable.sh
        python3 - <<'PY'
        from datetime import datetime, timezone
        from pathlib import Path
        from xml.etree import ElementTree

        namespace = {'m': 'http://maven.apache.org/POM/4.0.0'}
        pom = ElementTree.parse('pom.xml')
        version = pom.findtext('m:version', namespaces=namespace)
        if version == '${revision}':
            version = pom.findtext('m:properties/m:revision', namespaces=namespace)
        if not version:
            raise ValueError('LanguageTool source version not found')
        timestamp = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
        Path('languagetool-core/src/main/resources/git.properties').write_text(
            f'git.build.version={version}\ngit.build.time={timestamp}\ngit.commit.id.abbrev=\n'
        )
        PY
        mvn --offline --batch-mode --settings maven-settings.xml \
          -Dmaven.repo.local="${PWD}/m2/repository" \
          -DskipTests -Dmaven.gitcommitid.skip=true -pl languagetool-standalone -am package
      - unzip -q languagetool-standalone/target/LanguageTool-*.zip -d distribution
      - mkdir -p /app/languagetool
      - cp -a distribution/LanguageTool-*/. /app/languagetool/
    sources:
      - url: https://github.com/languagetool-org/languagetool/archive/refs/tags/v6.8.tar.gz
        type: archive
        sha256: 5a1cab8e63e67d7c1b8f557cb0273adf4a1b248f902ddd08ae415a849bf4ff96
        x-checker-data:
          type: anitya
          project-id: 241970
          url-template: https://github.com/languagetool-org/languagetool/archive/refs/tags/v$version.tar.gz
      - type: patch
        path: languagetool-os-maven-plugin.patch
      - maven-dependencies.json
      - type: file
        path: maven-settings.xml

  - name: pandoc
    buildsystem: simple
    build-commands:
      - install -D bin/pandoc /app/bin/pandoc
    # pandoc is only needed for converting the changelog
    cleanup:
      - '*'
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz
        sha256: 37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6
        x-checker-data:
          type: anitya
          project-id: 2589
          url-template: https://github.com/jgm/pandoc/releases/download/$version/pandoc-$version-linux-amd64.tar.gz
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-arm64.tar.gz
        sha256: 56ed5566ec41d22ec9ee0704e6ac0b98ba102e92384efd5306173a22d314c79a
        x-checker-data:
          type: anitya
          project-id: 2589
          url-template: https://github.com/jgm/pandoc/releases/download/$version/pandoc-$version-linux-arm64.tar.gz

  - name: texstudio
    buildsystem: cmake-ninja
    config-opts:
      - -Wno-dev
    cleanup-platform:
      - /bin
      - /mkspecs
    sources:
      - type: git
        url: https://github.com/texstudio-org/texstudio.git
        tag: 4.9.9
        commit: d285921900394dc8aa151a12f5a12022bddbb351
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
          is-main-source: true
      - type: file
        path: changelog2metainfo.sh
      - type: file
        path: texstudio.sh
      - type: shell
        commands:
          - sed -e "s|setDesktopFileName(\"texstudio\")|setDesktopFileName(\"org.texstudio.TeXstudio\")|"
            -i src/main.cpp
          - desktop-file-edit --set-key=Exec --set-value="texstudio.sh %F" utilities/texstudio.desktop
          - chmod +x ./changelog2metainfo.sh && ./changelog2metainfo.sh
          - sed -zi "s|</description>[[:space:]]*<launchable|<p>Requires either TeX
            Live being installed on the system from your distribution's repositories
            or the TeX Live Flatpak which you can install by running 'flatpak install
            flathub org\.freedesktop\.Sdk\.Extension\.texlive//25\.08'</p></description><launchable|"
            utilities/texstudio.metainfo.xml
    build-commands:
      - install -Dm755 -t ${FLATPAK_DEST}/bin/ ./texstudio.sh
